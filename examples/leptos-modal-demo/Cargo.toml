[package]
name = "leptos-modal-demo"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
glastor-aria-core = { path = "../../crates/glastor-aria-core" }
leptos = { version = "0.7", features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "Document", "Element", "HtmlElement", "KeyboardEvent", "Window"] }

[build-dependencies]
glastor-css-binder = { path = "../../crates/glastor-css-binder" }
