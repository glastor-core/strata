name: Release & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-crates:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate CARGO_REGISTRY_TOKEN secret
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Falta configurar el secret CARGO_REGISTRY_TOKEN en GitHub Settings -> Secrets and variables -> Actions."
            exit 1
          fi
      - name: Publish glastor-aria-core
        run: cargo publish -p glastor-aria-core --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Publish glastor-css-binder
        run: cargo publish -p glastor-css-binder --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Wait for crates.io index propagation
        run: sleep 30
      - name: Publish glastor-ui-cli
        run: cargo publish -p glastor-ui-cli --token ${{ secrets.CARGO_REGISTRY_TOKEN }}


