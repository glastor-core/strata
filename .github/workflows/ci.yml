name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Test Suite & Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all --check

      - name: Clippy Linter
        run: cargo clippy --workspace --all-targets --all-features

      - name: Run Tests
        run: cargo test --workspace --all-features --verbose

      - name: Documentation Build
        run: cargo doc --workspace --no-deps --all-features

  glastor-ecosystem-audit:
    name: GLASTOR® Core Audit (byte-gauge, specter, zerho)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: byte-gauge Wasm Footprint & Latency Audit
        run: cargo test -p glastor-aria-core --test memory_footprint -- --nocapture

      - name: specter AST Contract & SemVer Diffing
        run: cargo run --bin cargo-ui -- audit

      - name: zerho Edge Docs & llms.txt Verification
        run: |
          cargo run --bin cargo-ui -- generate-llms
          test -f llms.txt
          test -f llms-full.txt
