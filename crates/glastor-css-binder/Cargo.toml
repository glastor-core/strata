[package]
name = "glastor-css-binder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Native Zero-Node CSS scanning, compilation and bundling engine for Rust web applications."
keywords = ["css", "bundler", "zero-node", "tailwind", "wasm"]
categories = ["web-programming", "development-tools", "wasm"]

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = ["std"]
std = []
serde = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
tempfile = "3.17.1"
