<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="layerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#ffffff" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Squircle container -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.25" fill="none" stroke="#27272a" stroke-width="1.5"/>
  
  <!-- GLASTOR® Core Stacked Layers Icon -->
  <g transform="translate(4, 4)" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)">
    <polygon points="12 2 2 7 12 12 22 7 12 2" fill="url(#layerGrad)" stroke="#18181b" stroke-width="0.75"/>
    <polyline points="2 12 12 17 22 12" fill="none" stroke="#fafafa" stroke-width="2.2"/>
    <polyline points="2 17 12 22 22 17" fill="none" stroke="#a1a1aa" stroke-width="2.2"/>
  </g>
</svg>
